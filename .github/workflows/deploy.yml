# Test, build and deploy the site to GitHub Pages, then check the live site and ping IndexNow.
# Runs on every push to main (except docs-only changes), after each policy check, and by hand.
# Fails safe: a failed test, build or browser check stops before deploy, so the last good site stays live.
name: Deploy site

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # The one setting for the public address. Set the repository variable SITE_URL to move the site to a custom domain.
  SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
  SUPPORT_URL: ${{ vars.SUPPORT_URL }}          # optional money slot
  SUPPORT_LABEL: ${{ vars.SUPPORT_LABEL }}
  GOATCOUNTER_URL: ${{ vars.GOATCOUNTER_URL }}  # optional cookieless page counts

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Build
        run: python3 -m pipeline.build
      - name: Share cards
        run: python3 -m pipeline.og dist
      - name: Every page in headless Chrome, desktop and phone
        run: node scripts/e2e.mjs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - uses: actions/upload-artifact@v7
        with:
          name: urls
          path: dist/urls.txt
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  after-deploy:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          name: urls
      - name: Check the live site in headless Chrome
        run: |
          for attempt in 1 2 3; do
            node scripts/e2e.mjs "$SITE_URL/" && exit 0
            sleep 90
          done
          exit 1
      - name: Tell search engines (IndexNow)
        run: python3 scripts/indexnow.py urls.txt
